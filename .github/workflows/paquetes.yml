name: Mind 1.0.5 universal Rust
on: workflow_dispatch
permissions:
  contents: read
jobs:
  nativo:
    uses: ./.github/workflows/nativo.yml
  paquete:
    needs: nativo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v4
        with:
          pattern: nativo-*
          path: artefactos
          merge-multiple: true
      - name: Construir ZIP universal firmado para ensayo
        shell: bash
        run: |
          mkdir -p dist
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          node --input-type=module -e 'import { generateKeyPairSync } from "node:crypto"; import { writeFileSync } from "node:fs"; const {publicKey,privateKey}=generateKeyPairSync("ed25519"); writeFileSync(process.argv[1],privateKey.export({type:"pkcs8",format:"pem"}),{mode:0o600}); writeFileSync("dist/clave-ensayo-publica.pem",publicKey.export({type:"spki",format:"pem"}));' "$key"
          node scripts/construir-paquetes.mjs --ensayo --binarios artefactos --salida dist --clave-publicacion "$key"
          version="$(node -p 'require("./packaging/publicacion.json").mindVersion')"
          node scripts/firmar-actualizacion.mjs --verificar "$version" dist --clave-ensayo dist/clave-ensayo-publica.pem
      - uses: actions/upload-artifact@v4
        with:
          name: mind-universal-rust-ensayo
          path: dist/
          retention-days: 1
          if-no-files-found: error
