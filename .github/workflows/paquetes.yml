name: Mind universal
# Flujo manual del repositorio privado. Consume su cuota si se ejecuta.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: node scripts/preparar-paridad.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: mind-universal-para-validar
          path: |
            dist/candidatos/*.zip
            dist/ensayo/*.zip
            dist/matriz.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  probar:
    needs: construir
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: win32-x64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      MIND_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: mind-universal-para-validar
          path: dist
      - run: npm test
      - name: Probar los mismos archivos en el destino nativo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $actual = node -p "process.platform + '-' + process.arch"
          if ($actual -ne $env:MIND_TARGET) { throw 'El ejecutor no corresponde al destino' }
          $matrix = Get-Content dist/matriz.json -Raw | ConvertFrom-Json
          $row = $matrix.paquetes | Where-Object plataforma -eq $env:MIND_TARGET
          node scripts/probar-paquete.mjs "dist/candidatos/$($row.paquete.name)" "dist/ensayo/$($row.actualizacion.name)" $row.paquete.sha256 $row.actualizacion.sha256 dist/informes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-${{ matrix.target }}
          path: dist/informes/*.json
          if-no-files-found: warn
